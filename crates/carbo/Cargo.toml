[package]
name = "carbo"
version = "0.1.0"

edition = "2024"

[dependencies]
derive-debug = { version = "0.1" }
miette = { version = "7.6", features = [ "fancy" ] }
pollster = { version = "0.4" }
portable-pty = { version = "0.9" }
tracing = { version = "0.1" }
tracing-perfetto = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
vello = { version = "0.8" }
vt100 = { version = "0.16" }
wgpu = { version = "28" }
winit = { version = "0.30" }

[lints]
workspace = true
